name: Blender integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install ".[geometry]"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxi6 libxrender1 libxxf86vm1
      - name: Download and verify Blender 5.1.2
        shell: python
        run: |
          import hashlib, os, pathlib, tarfile, urllib.request
          base = 'https://download.blender.org/release/Blender5.1/'
          name = 'blender-5.1.2-linux-x64.tar.xz'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / name
          sums = urllib.request.urlopen(base + 'blender-5.1.2.sha256', timeout=60).read().decode()
          expected = next(line.split()[0] for line in sums.splitlines() if line.split()[-1].lstrip('*') == name)
          urllib.request.urlretrieve(base + name, archive)
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected
          with tarfile.open(archive) as source:
              source.extractall(archive.parent, filter='data')
          with open(os.environ['GITHUB_PATH'], 'a') as target:
              target.write(str(archive.parent / name.removesuffix('.tar.xz')) + '\n')
      - run: python -B blender/package_addon.py dist/homespatial_model-0.3.1.zip
      - run: blender --background --factory-startup --python-exit-code 1 --python blender/tests/test_parameter_scene.py -- --contract-src src --mode fixture --out artifacts/fixture
      - run: python -B blender/tests/verify_parameter_exports.py --output artifacts/fixture
      - run: blender --background --factory-startup --python-exit-code 1 --python blender/tests/test_installed_parameter_addon.py -- --zip dist/homespatial_model-0.3.1.zip --blend artifacts/fixture/edited.blend --exclude src --out artifacts/installed
      - run: blender --background --factory-startup --python-exit-code 1 --python blender/tests/test_review.py -- --contract-src src --blend artifacts/fixture/edited.blend --out artifacts/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-validation
          path: artifacts/
