name: Core and release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[geometry,dev]"
      - run: python -B scripts/check_public_release.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_release.py --out dist/ci
      - name: Install wheel and run outside the checkout
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist/ci').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          env = dict(os.environ)
          env.pop('PYTHONPATH', None)
          cli = shutil.which('restruct')
          assert cli, 'Installed wheel did not create the restruct command'
          model = pathlib.Path('blender/examples/room.json').resolve()
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run([cli, 'validate', str(model)], cwd=tmp, env=env, check=True)
              subprocess.run([cli, '--help'], cwd=tmp, env=env, check=True)
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: source-core-addon-candidate
          path: dist/ci/*
